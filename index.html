<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DynamicNotch – The Dynamic Notch your Mac actually needs</title>
<meta name="description" content="DynamicNotch turns the notch of your MacBook into something useful. Download it for macOS.">
<style>
:root{--rim:#b9b9c0;--bezel:#0b0b0c;--spring:cubic-bezier(.34,1.3,.5,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#fff;color:#fff;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.stage{position:fixed;inset:0;overflow:hidden;background:#fff}

/* MacBook (3D) */
.mac{position:absolute;left:50%;top:0;width:1200px;height:764px;margin-left:-600px;transform-origin:50% 0;
  perspective:6000px;perspective-origin:50% 25%;will-change:transform}
.rig{position:relative;width:1200px;height:764px;transform-style:preserve-3d;transform-origin:50% 764px}
.lidwrap{position:absolute;left:0;top:0;width:1200px;height:764px;transform-style:preserve-3d;transform-origin:50% 100%}
.lid{border:2px solid var(--rim);border-bottom:0;border-radius:28px 28px 0 0;background:var(--bezel);padding:14px 14px 18px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{position:absolute;inset:0;border-radius:28px 28px 0 0;transform:rotateY(180deg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:linear-gradient(160deg,#e4e4e8 0%,#c8c8ce 55%,#d6d6db 100%)}
.deck{position:absolute;left:0;top:767px;width:1200px;height:780px;transform-origin:50% 0;transform:rotateX(90deg);
  border-radius:0 0 26px 26px;background:linear-gradient(#e6e6ea,#cdcdd3)}
.deck::before{content:"";position:absolute;left:70px;right:70px;top:46px;height:360px;border-radius:12px;
  background:repeating-linear-gradient(90deg,transparent 0 58px,#2b2b30 58px 62px),
             repeating-linear-gradient(0deg,transparent 0 58px,#2b2b30 58px 62px),#0d0d0f}
.deck::after{content:"";position:absolute;left:50%;width:420px;margin-left:-210px;bottom:70px;height:260px;border-radius:14px;
  border:2px solid rgba(0,0,0,.12);background:rgba(255,255,255,.35)}
.front{position:absolute;left:0;top:767px;width:1200px;height:16px;transform:translateZ(780px);
  border-radius:0 0 22px 22px;background:linear-gradient(#b8b8be,#8e8e95)}
.shadow{position:absolute;left:-60px;top:775px;width:1320px;height:840px;transform-origin:50% 0;transform:rotateX(90deg);
  border-radius:50px;background:rgba(0,0,0,.3);filter:blur(40px)}

.screen{position:relative;height:730px;border-radius:8px;overflow:hidden;background:
  radial-gradient(70% 60% at 78% 18%,#4a35b8 0%,transparent 70%),
  radial-gradient(60% 70% at 12% 38%,#0f6aa3 0%,transparent 70%),
  radial-gradient(90% 60% at 50% 105%,#c13a74 0%,transparent 70%),#0a0a22}
.menubar{position:absolute;top:0;left:0;right:0;height:30px;display:flex;justify-content:space-between;align-items:center;
  padding:0 120px;background:rgba(0,0,0,.22);font-size:13px;color:rgba(255,255,255,.9)}
.menubar span{display:flex;gap:20px}
.mnotch{position:absolute;top:0;left:50%;width:152px;height:30px;margin-left:-76px;background:#000;border-radius:0 0 10px 10px}

/* Notch, expands over the screen */
.notch{position:absolute;left:50%;top:0;transform:translateX(-50%);background:#000;overflow:hidden;opacity:0;
  border-radius:0 0 10px 10px;
  transition:width .95s var(--spring),height .95s var(--spring),border-radius .95s var(--spring),box-shadow 1s}
.notch.on{opacity:1}
.notch.big{box-shadow:0 30px 80px rgba(0,0,0,.5)}
.copy{position:absolute;left:50%;text-align:center;white-space:nowrap;font-weight:650;letter-spacing:-.03em;line-height:1.14}
.line{display:block}
.line.two{color:rgba(255,255,255,.62)}
.w{display:inline-block;opacity:0;transform:translateY(.35em);filter:blur(10px);
  transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1),filter .6s ease}
.w.in{opacity:1;transform:none;filter:none}

/* Buttons */
.cta{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:18px;
  padding:0 20px;opacity:0;transform:translateY(14px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.cta.show{opacity:1;transform:none}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 26px;border-radius:999px;
  font-size:17px;font-weight:600;text-decoration:none;transition:transform .2s ease,background .2s ease}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn.primary{background:#fff;color:#000}
.btn.primary:hover{transform:scale(1.03)}
.btn.ghost{color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.btn.ghost:hover{background:rgba(255,255,255,.2)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.note{font-size:13px;color:rgba(255,255,255,.6);text-align:center}
</style>
</head>
<body>
<div class="stage">

    <div class="rig" id="rig">
      <div class="shadow"></div>
      <div class="deck"></div>
      <div class="front"></div>
      <div class="lidwrap" id="lid">
        <div class="lid">
          <div class="screen">
            <div class="menubar">
              <span><b>Finder</b><i>File</i><i>Edit</i><i>View</i><i>Go</i><i>Window</i></span>
              <span><i>9:41</i></span>
            </div>
            <div class="mnotch"></div>
          </div>
        </div>
        <div class="back"></div>
      </div>
    </div>
  </div>

  <div class="notch" id="notch">
    <h1 class="copy" id="copy" aria-label="The Dynamic Notch your Mac actually needs">
      <span class="line" id="l1"><span class="w">The</span> <span class="w">Dynamic</span> <span class="w">Notch</span></span>
      <span class="line two" id="l2"><span class="w">your</span> <span class="w">Mac</span> <span class="w">actually</span> <span class="w">needs.</span></span>
    </h1>
  </div>

  <div class="cta" id="cta">
    <div class="row">

    </div>

</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const mac = $('#mac'), rig = $('#rig'), lid = $('#lid'), notch = $('#notch'), copy = $('#copy'),
        l1 = $('#l1'), l2 = $('#l2'), cta = $('#cta');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MW = 1200, MH = 780, LID_H = 764, SCREEN_OFFSET = 16; // Rand 2px + Bezel 14px
  const TILT = 50; // Kamerawinkel von oben im geschlossenen Zustand
  let m, finished = false;

  const T = (ty, s) => `translate3d(0,${ty}px,0) scale(${s})`;

  function metrics() {
    const vw = innerWidth, vh = innerHeight;
    const sf = Math.max(1.25, vw * 1.12 / MW, vh * 1.08 / (LID_H - 20));
    let fs = Math.max(22, Math.min(vw * 0.062, 68));
    const measure = () => { copy.style.fontSize = fs + 'px'; return [l1.offsetWidth, l2.offsetWidth]; };
    let [w1, w2] = measure();
    const need = Math.max(w1, w2) + fs * 1.8;
    if (need > vw - 24) { fs *= (vw - 24) / need; [w1, w2] = measure(); }
    const padY = fs * .5, padX = fs * .9, lineH = fs * 1.14;
    const wA = w1 + padX * 2, wB = Math.max(w1, w2) + padX * 2;
    copy.style.width = wB + 'px';
    copy.style.marginLeft = -wB / 2 + 'px';
    copy.style.top = padY + 'px';
    const hB = padY * 2 + lineH * 2;
    return { vw, vh, sf, fs, wA, wB, hA: padY * 2 + lineH, hB, r: fs * .6,
             top: SCREEN_OFFSET * sf, ctaTop: SCREEN_OFFSET * sf + hB + Math.max(28, fs * .8) };
  }

  function setNotch(w, h, r) {
    notch.style.width = w + 'px'; notch.style.height = h + 'px';
    notch.style.borderRadius = `0 0 ${r}px ${r}px`;
  }
  const words = (line, step) => [...line.querySelectorAll('.w')].forEach((w, i) => {
    w.style.transitionDelay = (i * step) + 's'; w.classList.add('in');
  });
  const noTransition = fn => {
    notch.style.transition = 'none'; fn(); void notch.offsetWidth; notch.style.transition = '';
  };
  // Animation starten und den Endzustand danach fest in den Styles speichern
  function run(el, from, to, opts) {
    el.style.transform = from;
    const a = el.animate([{ transform: from }, { transform: to }], { fill: 'forwards', ...opts });
    return a.finished.then(() => { el.style.transform = to; a.cancel(); });
  }

  function showFinal() {
    m = metrics();
    mac.style.transform = T(0, m.sf);
    rig.style.transform = 'rotateX(0deg)';
    lid.style.transform = 'rotateX(0deg)';
    noTransition(() => { notch.style.top = m.top + 'px'; setNotch(m.wB, m.hB, m.r); });
    notch.classList.add('on', 'big');
    cta.style.top = m.ctaTop + 'px';
    cta.classList.add('show');
    document.querySelectorAll('.w').forEach(w => { w.style.transitionDelay = '0s'; w.classList.add('in'); });
    finished = true;
  }

  function play() {
    m = metrics();
    // 1) Mac geschlossen, von oben gesehen
    const s0 = Math.min(innerWidth * .5 / 1300, innerHeight * .5 / 650);
    const ty0 = innerHeight / 2 - s0 * (LID_H + 300);
    // 2) Mac aufgeklappt, komplett sichtbar
    const s1 = Math.min(innerWidth * .52 / MW, innerHeight * .58 / MH);
    const ty1 = (innerHeight - MH * s1) / 2;

    mac.style.transform = T(ty0, s0);
    rig.style.transform = `rotateX(-${TILT}deg)`;
    lid.style.transform = 'rotateX(-90deg)';
    noTransition(() => { notch.style.top = m.top + 'px'; setNotch(152 * m.sf, 30 * m.sf, 10 * m.sf); });
    cta.style.top = m.ctaTop + 'px';

    setTimeout(() => {
      // Aufklappen: Deckel dreht hoch, Kamera geht von oben nach vorne
      const D1 = 2600;
      run(mac, T(ty0, s0), T(ty1, s1), { duration: D1, easing: 'cubic-bezier(.45,0,.25,1)' });
      run(rig, `rotateX(-${TILT}deg)`, 'rotateX(0deg)', { duration: D1 * .85, delay: D1 * .15, easing: 'cubic-bezier(.45,0,.25,1)' });
      run(lid, 'rotateX(-90deg)', 'rotateX(0deg)', { duration: D1 * .8, easing: 'cubic-bezier(.4,0,.2,1)' });

      setTimeout(() => {
        // Heranzoomen bis zum oberen Rand
        run(mac, T(ty1, s1), T(0, m.sf), { duration: 3000, easing: 'cubic-bezier(.7,0,.2,1)' }).then(() => {
          notch.classList.add('on');
          setTimeout(() => { setNotch(m.wA, m.hA, m.r); setTimeout(() => words(l1, .09), 250); }, 300);
          setTimeout(() => { notch.classList.add('big'); setNotch(m.wB, m.hB, m.r); setTimeout(() => words(l2, .08), 200); }, 1500);
          setTimeout(() => { cta.classList.add('show'); finished = true; }, 2900);
        });
      }, D1 + 250);
    }, 900);
  }

  addEventListener('resize', () => { if (finished) showFinal(); });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => reduce ? showFinal() : play());
})();
</script>
</body>
