<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DynamicNotch – The Dynamic Notch your Mac actually needs</title>
<meta name="description" content="DynamicNotch turns the notch of your MacBook into something useful. Download it for macOS.">
<style>
:root{--spring:cubic-bezier(.34,1.3,.5,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#fff;color:#fff;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.stage{position:fixed;inset:0;overflow:hidden;background:#fff}

/* MacBook */
.mac{position:absolute;left:50%;top:0;width:1200px;margin-left:-600px;transform-origin:50% 0;will-change:transform}
/* Aluminium-Rand, gebürstet mit Glanzkante */
.lid{position:relative;padding:3px 3px 0;border-radius:30px 30px 0 0;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.04) 1px 3px),
    linear-gradient(180deg,#fdfdfe 0%,#dcdce1 28%,#b4b4bb 62%,#8f8f97 100%);
  box-shadow:0 -1px 0 rgba(0,0,0,.28),0 -10px 36px rgba(0,0,0,.12)}
/* schwarzer Glas-Bezel */
.bezel{position:relative;padding:14px 14px 18px;border-radius:27px 27px 0 0;
  background:linear-gradient(180deg,#0e0e11 0%,#060608 55%,#030304 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.035)}
.bezel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(112deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.02) 38%,transparent 39%)}
.screen{position:relative;height:729px;border-radius:7px;overflow:hidden;
  box-shadow:0 0 0 1px #000,0 0 0 2px rgba(255,255,255,.05);
  background:
  radial-gradient(70% 60% at 78% 18%,#4a35b8 0%,transparent 70%),
  radial-gradient(60% 70% at 12% 38%,#0f6aa3 0%,transparent 70%),
  radial-gradient(90% 60% at 50% 105%,#c13a74 0%,transparent 70%),#0a0a22}
/* Reflexion auf dem Display */
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.075) 0%,rgba(255,255,255,.015) 34%,transparent 35%),
             radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.28) 100%);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.55)}
.mnotch{position:absolute;top:0;left:50%;width:152px;height:30px;margin-left:-76px;background:#000;border-radius:0 0 10px 10px}
.cam{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#4f5f8c 0,#11141d 42%,#000 72%);box-shadow:0 0 0 1.5px #0b0b0e;transition:opacity .35s}
.base{position:relative;height:16px;width:1320px;margin-left:-60px;border-radius:0 0 26px 26px;
  background:linear-gradient(180deg,#f6f6f8 0%,#d8d8de 22%,#b2b2b9 68%,#8a8a92 100%);
  box-shadow:inset 0 1px 0 #fff}
.base::after{content:"";position:absolute;top:0;left:50%;width:190px;height:6px;margin-left:-95px;
  background:linear-gradient(#9d9da5,#c9c9cf);border-radius:0 0 9px 9px}
.gshadow{position:absolute;left:-8%;width:116%;top:752px;height:70px;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 40%,rgba(0,0,0,.32) 0%,transparent 72%)}

/* Notch, expands over the screen */
.notch{position:absolute;left:50%;top:0;transform:translateX(-50%);background:#000;overflow:hidden;opacity:0;
  border-radius:0 0 10px 10px;
  transition:width .8s var(--spring),height .8s var(--spring),border-radius .8s var(--spring),box-shadow .8s}
.notch.on{opacity:1}
.notch.big{box-shadow:0 30px 80px rgba(0,0,0,.5)}
.notch .cam{top:calc(15px*var(--u,1));width:calc(10px*var(--u,1));height:calc(10px*var(--u,1));
  margin:calc(-5px*var(--u,1)) 0 0 calc(-5px*var(--u,1))}
.notch.open .cam{opacity:0}
.copy{position:absolute;left:50%;text-align:center;white-space:nowrap;font-weight:650;letter-spacing:-.03em;line-height:1.14}
.line{display:block}
.line.two{color:rgba(255,255,255,.62)}
.w{display:inline-block;opacity:0;transform:translateY(.35em);filter:blur(10px);
  transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1),filter .5s ease}
.w.in{opacity:1;transform:none;filter:none}

/* Buttons */
.cta{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:18px;
  padding:0 20px;opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.cta.show{opacity:1;transform:none}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 26px;border-radius:999px;
  font-size:17px;font-weight:600;text-decoration:none;transition:transform .2s ease,background .2s ease}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn.primary{background:#fff;color:#000}
.btn.primary:hover{transform:scale(1.03)}
.btn.ghost{color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.btn.ghost:hover{background:rgba(255,255,255,.2)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.note{font-size:13px;color:rgba(255,255,255,.6);text-align:center}
</style>
</head>
<body>
<div class="stage">
  <div class="mac" id="mac" aria-hidden="true">
    <div class="gshadow"></div>
    <div class="lid">
      <div class="bezel">
        <div class="screen">
          <div class="mnotch"><div class="cam"></div></div>
        </div>
      </div>
    </div>
    <div class="base"></div>
  </div>

  <div class="notch" id="notch">
    <div class="cam"></div>
    <h1 class="copy" id="copy" aria-label="The Dynamic Notch your Mac actually needs">
      <span class="line" id="l1"><span class="w">The</span> <span class="w">Dynamic</span> <span class="w">Notch</span></span>
      <span class="line two" id="l2"><span class="w">your</span> <span class="w">Mac</span> <span class="w">actually</span> <span class="w">needs.</span></span>
    </h1>
  </div>

  <div class="cta" id="cta">
    <div class="row">
      <!-- TODO: DEIN-USER / DEIN-REPO / Dateiname anpassen (oder "/download" mit Weiterleitung nutzen) -->

</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const mac = $('#mac'), notch = $('#notch'), copy = $('#copy'), l1 = $('#l1'), l2 = $('#l2'), cta = $('#cta');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MW = 1200, MH = 780, LID_H = 764, SCREEN_OFFSET = 17; // Alu-Rand 3px + Bezel 14px
  let m, finished = false;

  const T = (ty, s) => `translate3d(0,${ty}px,0) scale(${s})`;

  function metrics() {
    const vw = innerWidth, vh = innerHeight;
    const margin = Math.round(vh * .09);                       // weißer Rand über dem Mac
    const sf = Math.max(1.25, vw * 1.12 / MW, (vh - margin) * 1.05 / (LID_H - 20));
    let fs = Math.max(22, Math.min(vw * .062, 68));
    const measure = () => { copy.style.fontSize = fs + 'px'; return [l1.offsetWidth, l2.offsetWidth]; };
    let [w1, w2] = measure();
    const need = Math.max(w1, w2) + fs * 1.8;
    if (need > vw - 24) { fs *= (vw - 24) / need; [w1, w2] = measure(); }
    const padX = fs * .9, padY = fs * .5, lineH = fs * 1.14;
    const top = margin + SCREEN_OFFSET * sf;                   // Oberkante des Displays
    const hA = padY * 2 + lineH, hB = padY * 2 + lineH * 2;    // Notch passt sich der Schrift an
    copy.style.width = Math.max(w1, w2) + padX * 2 + 'px';
    copy.style.marginLeft = -(Math.max(w1, w2) + padX * 2) / 2 + 'px';
    copy.style.top = padY + 'px';
    return { vw, vh, margin, sf, fs, hA, hB, r: fs * .6,
             wA: w1 + padX * 2, wB: Math.max(w1, w2) + padX * 2,
             top, ctaTop: top + hB + Math.max(28, fs * .8) };
  }

  function setNotch(w, h, r) {
    notch.style.width = w + 'px'; notch.style.height = h + 'px';
    notch.style.borderRadius = `0 0 ${r}px ${r}px`;
  }
  const words = (line, step) => [...line.querySelectorAll('.w')].forEach((w, i) => {
    w.style.transitionDelay = (i * step) + 's'; w.classList.add('in');
  });
  const noTransition = fn => {
    notch.style.transition = 'none'; fn(); void notch.offsetWidth; notch.style.transition = '';
  };
  function prepNotch() {
    notch.style.setProperty('--u', m.sf);
    noTransition(() => { notch.style.top = m.top + 'px'; setNotch(152 * m.sf, 30 * m.sf, 10 * m.sf); });
    cta.style.top = m.ctaTop + 'px';
  }

  function showFinal() {
    m = metrics();
    mac.style.transform = T(m.margin, m.sf);
    prepNotch();
    noTransition(() => setNotch(m.wB, m.hB, m.r));
    notch.classList.add('on', 'big', 'open');
    cta.classList.add('show');
    document.querySelectorAll('.w').forEach(w => { w.style.transitionDelay = '0s'; w.classList.add('in'); });
    finished = true;
  }

  function play() {
    m = metrics();
    const s0 = Math.min(innerWidth * .66 / MW, innerHeight * .7 / MH);   // Start: Mac schon offen und nah
    const from = T((innerHeight - MH * s0) / 2, s0), to = T(m.margin, m.sf);
    mac.style.transform = from;
    prepNotch();

    setTimeout(() => {
      const a = mac.animate([{ transform: from }, { transform: to }],
        { duration: 1700, easing: 'cubic-bezier(.6,0,.2,1)', fill: 'forwards' });
      a.finished.then(() => {
        mac.style.transform = to; a.cancel();
        notch.classList.add('on');
        setTimeout(() => {
          notch.classList.add('open');
          setNotch(m.wA, m.hA, m.r);
          setTimeout(() => words(l1, .09), 200);
        }, 150);
        setTimeout(() => {
          notch.classList.add('big');
          setNotch(m.wB, m.hB, m.r);
          setTimeout(() => words(l2, .08), 150);
        }, 900);
        setTimeout(() => { cta.classList.add('show'); finished = true; }, 1900);
      });
    }, 400);
  }

  addEventListener('resize', () => { if (finished) showFinal(); });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => reduce ? showFinal() : play());
})();
</script>
</body>
